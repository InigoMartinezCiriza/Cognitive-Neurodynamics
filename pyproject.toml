[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bioinspired-rnn"
version = "1.0.0"
description = "Bioinspired RNN models (modified GRU actor-critic) for time-dependent reinforcement-learning tasks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Iñigo Martínez", email = "imartinezc@estudiante.uam.es" },
    { name = "Carlos M. Alaíz", email = "carlos.alaiz@uam.es" },
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Needed to train agents; the analysis of the saved results does not need it.
train = [
    "tensorflow-cpu>=2.17",
    "keras>=3.0",
    "gymnasium>=1.0",
]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
