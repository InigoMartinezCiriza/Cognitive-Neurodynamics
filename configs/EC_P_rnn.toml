# Partial-observables economic choice, modified (bioinspired) RNN agent
# Saved outputs: EC_P_rnn_<stage>.pkl, checkpoints: EC_P_rnn_<stage>/
name = "EC_P_rnn"
task = "economic_choice"
partial = true
seed = 1
description = "Partial-observables economic choice, modified (bioinspired) RNN agent"

[agent]
layer_type = "GRU_modified"
actor_hidden_size = 50
critic_hidden_size = 50
actor_prob_connection = 0.1     # 10 % of the actor hidden-layer connections are kept
critic_prob_connection = 1.0    # dense critic
alpha = 0.1                     # dt / tau of the modified GRU (unused by the other layers)
noise_std = 0.0                 # observation noise of the agent (disabled in all runs)
learning_rate = 0.004           # actor and critic (Adam); constant for the whole run

[training]
gamma = 1.0
l2_actor = 1e-4
l2_critic = 1e-4

[env]                           # Economic Choice task, common to all stages
dt = 10                         # ms per step
A_to_B_ratio = 2.2              # 1 drop of A = 2.2 drops of B
reward_B = 1
abort_penalty = -0.1
reward_go_fixation = -0.01

# Curriculum: duration_params = [fixation, offer_min, offer_max, decision_timeout] in ms;
# reward_fixation = reward per step of correct fixation.

[[stages]]
episodes = 10000
duration_params = [10, 10, 20, 20]
reward_fixation = 0.01
input_noise_sigma = 0.0

[[stages]]
episodes = 10000
duration_params = [10, 10, 20, 20]
reward_fixation = 0.01
input_noise_sigma = 0.01

[[stages]]
episodes = 5000
duration_params = [10, 10, 20, 20]
reward_fixation = 0.01
input_noise_sigma = 0.01

[[stages]]
episodes = 5000
duration_params = [10, 10, 20, 20]
reward_fixation = 0.01
input_noise_sigma = 0.01

[[stages]]
episodes = 10000
duration_params = [30, 20, 40, 40]
reward_fixation = 0.01
input_noise_sigma = 0.01

[[stages]]
episodes = 1000
duration_params = [60, 40, 80, 80]
reward_fixation = 0.01
input_noise_sigma = 0.01

[[stages]]
episodes = 1000
duration_params = [120, 80, 160, 160]
reward_fixation = 0.01
input_noise_sigma = 0.01

[[stages]]
episodes = 500
duration_params = [240, 160, 320, 320]
reward_fixation = 0.001
input_noise_sigma = 0.01

[[stages]]
episodes = 500
duration_params = [480, 320, 640, 640]
reward_fixation = 0.001
input_noise_sigma = 0.01

[[stages]]
episodes = 300
duration_params = [960, 640, 1280, 1280]
